name: Helm Release

# Lint + package + publish the Helm chart to GitHub Pages.
# Triggers on every push to main and on version tags (v*).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'deploy/helm/repo/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Lint chart (Kubernetes mode)
        run: helm lint deploy/helm/chart/nfs-csi-ngxstorage
      - name: Lint chart (OpenShift mode)
        run: helm lint deploy/helm/chart/nfs-csi-ngxstorage --set openshift.enabled=true
      - name: Template check — Kubernetes
        run: |
          helm template test deploy/helm/chart/nfs-csi-ngxstorage \
            --set openshift.enabled=false > /dev/null
      - name: Template check — OpenShift
        run: |
          helm template test deploy/helm/chart/nfs-csi-ngxstorage \
            --set openshift.enabled=true > /dev/null
      - name: External-resizer RBAC contract
        run: |
          helm template test deploy/helm/chart/nfs-csi-ngxstorage > /tmp/rendered.yaml
          if ! grep -A1 'resources: \["pods"\]' /tmp/rendered.yaml \
            | grep -Fq 'verbs: ["get", "list", "watch"]'; then
            echo "controller RBAC must grant pods get/list/watch for external-resizer" >&2
            exit 1
          fi
      - name: Namespace contract
        run: |
          rendered="$(helm template test deploy/helm/chart/nfs-csi-ngxstorage \
            --namespace namespace-contract \
            --set openshift.enabled=true \
            --set secret.create=true \
            --set secret.storageIPs=test \
            --set secret.poolName=test \
            --set secret.apiKey=test \
            --set secret.dataIP=test)"
          if grep -q '^kind: Namespace$' <<<"$rendered"; then
            echo "chart must not create its release namespace" >&2
            exit 1
          fi
          if grep -q 'namespace: nfs-csi-ngxstorage' <<<"$rendered"; then
            echo "namespaced resources ignored the Helm release namespace" >&2
            exit 1
          fi
          grep -q 'namespace: namespace-contract' <<<"$rendered"
          grep -q 'system:serviceaccount:namespace-contract:nfs-csi-ngxstorage-node' <<<"$rendered"

  publish:
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Package chart
        run: |
          helm package deploy/helm/chart/nfs-csi-ngxstorage \
            --destination deploy/helm/repo
      - name: Generate index
        run: |
          helm repo index deploy/helm/repo \
            --url https://ngxstorage.github.io/nfs-csi-ngxstorage-driver
      - name: Commit packaged chart to main
        if: github.ref == 'refs/heads/main'
        run: |
          if [[ -z "$(git status --porcelain -- deploy/helm/repo)" ]]; then
            echo "Helm repository artifacts are already current"
            exit 0
          fi
          chart_version="$(helm show chart deploy/helm/chart/nfs-csi-ngxstorage | awk '/^version:/ {print $2}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/repo/index.yaml "deploy/helm/repo/nfs-csi-ngxstorage-${chart_version}.tgz"
          git commit -m "chore(helm): publish chart ${chart_version}"
          git push origin HEAD:main
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/helm/repo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
