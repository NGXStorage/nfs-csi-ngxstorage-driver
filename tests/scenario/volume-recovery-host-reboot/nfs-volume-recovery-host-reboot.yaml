apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: nfs-reboot-pvc}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 1Gi}}
  storageClassName: nfs-reboot-sc
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nfs-volume-recovery-host-reboot}
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 0
  selector: {matchLabels: {app: nfs-volume-recovery-host-reboot}}
  template:
    metadata: {labels: {app: nfs-volume-recovery-host-reboot}}
    spec:
      tolerations:
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
      - name: nginx
        image: nginx
        command: ["/bin/sh", "-c"]
        args: ["test -f /data/marker.txt || printf 'nfs-reboot\\n' >/data/marker.txt; sha256sum /data/marker.txt >/data/marker.sha256; tail -f /dev/null"]
        volumeMounts: [{name: nfs, mountPath: /data}]
      volumes:
      - {name: nfs, persistentVolumeClaim: {claimName: nfs-reboot-pvc}}
