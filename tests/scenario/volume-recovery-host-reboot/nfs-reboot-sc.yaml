apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-reboot-sc
provisioner: nfs.csi.ngxstorage.com
parameters:
  blocksize: "128k"
  deduplication: "off"
  compression: "off"
  permissions: "111111111"
volumeBindingMode: Immediate
reclaimPolicy: Delete
mountOptions:
  - nfsvers=4.1
