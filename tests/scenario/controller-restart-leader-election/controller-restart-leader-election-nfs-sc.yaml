apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: controller-restart-leader-election-nfs-sc
provisioner: nfs.csi.ngxstorage.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  blocksize: "128k"
  deduplication: "on"
  compression: "on"
  permissions: "111111111"
mountOptions:
  - nfsvers=4.1
