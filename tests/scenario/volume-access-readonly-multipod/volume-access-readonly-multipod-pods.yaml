apiVersion: v1
kind: Pod
metadata:
  name: volume-access-readonly-volume-access-readwrite-multipod-pod1
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  securityContext:
    seLinuxOptions: {user: system_u, role: system_r, type: container_t, level: s0:c100,c200}
  containers:
  - name: client-container
    image: nginx
    volumeMounts:
    - name: volume-access-readonly-volume-access-readwrite-multipod-pvc
      mountPath: /data # any path
      readOnly: false # true, false
  volumes:
  - name: volume-access-readonly-volume-access-readwrite-multipod-pvc
    persistentVolumeClaim:
      claimName: volume-access-readonly-volume-access-readwrite-multipod-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-access-readonly-volume-access-readwrite-multipod-pod2
  namespace: default
spec:
  securityContext:
    seLinuxOptions: {user: system_u, role: system_r, type: container_t, level: s0:c100,c200}
  containers:
  - name: client-container
    image: nginx
    volumeMounts:
    - name: volume-access-readonly-volume-access-readwrite-multipod-pvc
      mountPath: /data # any path
      # this is the only difference between this file and volume-access-readwrite-multipod-pods.yaml, where readOnly is set to true
      # this pod is not allowed to write to the volume
      readOnly: true # true, false
  volumes:
  - name: volume-access-readonly-volume-access-readwrite-multipod-pvc
    persistentVolumeClaim:
      claimName: volume-access-readonly-volume-access-readwrite-multipod-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-access-readonly-volume-access-readwrite-multipod-pod3
  namespace: default
spec:
  securityContext:
    seLinuxOptions: {user: system_u, role: system_r, type: container_t, level: s0:c100,c200}
  containers:
  - name: client-container
    image: nginx
    volumeMounts:
    - name: volume-access-readonly-volume-access-readwrite-multipod-pvc
      mountPath: /data # any path
      readOnly: false # true, false
  volumes:
  - name: volume-access-readonly-volume-access-readwrite-multipod-pvc
    persistentVolumeClaim:
      claimName: volume-access-readonly-volume-access-readwrite-multipod-pvc
