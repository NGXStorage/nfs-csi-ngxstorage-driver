apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: volume-access-readonly-sc
provisioner: nfs.csi.ngxstorage.com
parameters:
  blocksize: "128k"
  deduplication: "on"
  compression: "on"
  permissions: "111111111"
volumeBindingMode: Immediate
reclaimPolicy: Delete
mountOptions:
  - nfsvers=4.1
