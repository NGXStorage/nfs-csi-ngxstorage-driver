apiVersion: v1
kind: Pod
metadata:
  name: volume-access-rwx-multinode-pod-a
  namespace: default
spec:
  # Pin to a worker so we can prove two different nodes mount the same volume.
  nodeSelector:
    kubernetes.io/hostname: __NODE_A__
  containers:
  - name: client-container
    image: nginx
    volumeMounts:
    - name: volume-access-rwx-multinode-pvc
      mountPath: /data
      readOnly: false
  volumes:
  - name: volume-access-rwx-multinode-pvc
    persistentVolumeClaim:
      claimName: volume-access-rwx-multinode-pvc
