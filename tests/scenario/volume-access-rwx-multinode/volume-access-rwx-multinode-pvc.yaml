apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volume-access-rwx-multinode-pvc
spec:
  accessModes:
    # ReadWriteMany: the same volume is mounted by pods on different nodes.
    - ReadWriteMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: volume-access-rwx-multinode-sc
