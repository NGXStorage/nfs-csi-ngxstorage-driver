apiVersion: v1
kind: Pod
metadata:
  name: volume-access-rwx-multinode-pod-b
  namespace: default
spec:
  nodeSelector:
    kubernetes.io/hostname: __NODE_B__
  containers:
  - name: client-container
    image: nginx
    volumeMounts:
    - name: volume-access-rwx-multinode-pvc
      mountPath: /data
      readOnly: false
  volumes:
  - name: volume-access-rwx-multinode-pvc
    persistentVolumeClaim:
      claimName: volume-access-rwx-multinode-pvc
