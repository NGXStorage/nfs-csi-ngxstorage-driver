kind: PersistentVolume
apiVersion: v1
metadata:
  name: volume-existing-static-pv
  annotations:
    pv.kubernetes.io/provisioned-by: nfs.csi.ngxstorage.com
spec:
  storageClassName: volume-existing-static-sc
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  csi:
    driver: nfs.csi.ngxstorage.com
    volumeHandle: nfs.csi.ngxstorage.com.__STATIC_SHARE_NAME__
    volumeAttributes:
      nfsvers: "nfsvers=3" # nfsvers=3, nfsvers=4.1, nfsvers=4.2
      readonly: "false" # true, false
