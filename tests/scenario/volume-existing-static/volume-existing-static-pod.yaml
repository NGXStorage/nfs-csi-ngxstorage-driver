apiVersion: v1
kind: Pod
metadata:
  name: volume-existing-static-pod
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  containers:
  - name: client-container
    image: nginx
    volumeMounts:
    - name: volume-existing-static-pvc
      mountPath: /data
      readOnly: false
  volumes:
  - name: volume-existing-static-pvc
    persistentVolumeClaim:
      claimName: volume-existing-static-pvc
