apiVersion: v1
kind: Pod
metadata:
  name: volume-access-readwrite-multipod-pod1
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  containers:
  - name: client-container
    image: nginx
    volumeMounts:
    - name: volume-access-readwrite-multipod-pvc
      mountPath: /data # any path
      readOnly: false # true, false
  volumes:
  - name: volume-access-readwrite-multipod-pvc
    persistentVolumeClaim:
      claimName: volume-access-readwrite-multipod-pvc
---
