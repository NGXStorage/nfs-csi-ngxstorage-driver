apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: multi-volume-pvc1
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: multi-volume-sc
