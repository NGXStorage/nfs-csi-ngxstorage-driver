apiVersion: v1
kind: Pod
metadata:
  name: multi-volume-pod
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  containers:
  - name: client-container
    image: nginx
    volumeMounts:
    - name: multi-volume-pvc1
      mountPath: /data1 # any path
      readOnly: false # true, false
    - name: multi-volume-pvc2
      mountPath: /data2 # any path
      readOnly: false # true, false
    - name: multi-volume-pvc3
      mountPath: /data3 # any path
      readOnly: false # true, false
  volumes:
  - name: multi-volume-pvc1
    persistentVolumeClaim:
      claimName: multi-volume-pvc1
  - name: multi-volume-pvc2
    persistentVolumeClaim:
      claimName: multi-volume-pvc2
  - name: multi-volume-pvc3
    persistentVolumeClaim:
      claimName: multi-volume-pvc3
