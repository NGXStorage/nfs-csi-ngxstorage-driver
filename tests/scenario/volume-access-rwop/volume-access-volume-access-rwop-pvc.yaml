apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volume-access-rwop-pvc
spec:
  accessModes:
    # ReadWriteOncePod: only one pod on the whole cluster may mount this PVC.
    - ReadWriteOncePod
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: volume-access-rwop-sc
