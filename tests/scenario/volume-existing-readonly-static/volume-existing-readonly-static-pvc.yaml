apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volume-existing-readonly-static-pvc
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  # name of the PersistentVolume to claim
  volumeName: volume-existing-readonly-static-pv
  resources:
    requests:
      storage: 1Gi
  storageClassName: volume-existing-readonly-static-sc
