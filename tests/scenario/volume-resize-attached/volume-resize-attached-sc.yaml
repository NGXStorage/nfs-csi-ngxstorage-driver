apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: extend-attached-sc
provisioner: nfs.csi.ngxstorage.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  blocksize: "128k"
  deduplication: "off"
  compression: "off"
  permissions: "111111111"
mountOptions:
  - nfsvers=4.1
