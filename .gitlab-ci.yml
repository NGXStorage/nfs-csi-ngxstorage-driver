
stages:
  - lint
  - test
  - build
  - sanity

variables:
  GO_VERSION: "1.27.4"

default:
  image: golang:${GO_VERSION}
  tags:
    - linux
    - docker
    - shared
  cache:
    key: go-mod-{{ checksum "go.sum" }}
    paths:
      - .gocache/mod
  before_script:
    - go env -w GOMODCACHE="$CI_PROJECT_DIR/.gocache/mod" GOCACHE="$CI_PROJECT_DIR/.gocache"

lint:
  stage: lint
  script:
    - test -z "$(gofmt -l pkg cmd)" || (echo "gofmt düzeltmesi gerekiyor:" && gofmt -l pkg cmd && exit 1)
    - go vet ./...

test:
  stage: test
  script:
    - go test -count=1 ./...

build:
  stage: build
  script:
    # SHARED csi-sanity: one binary for every driver, built from the pinned
    # fork commit (clean clone -> verify HEAD==SHA -> go build -mod=vendor).
    - bash tests/sanity/build-shared-sanity.sh build/shared-sanity/csi-sanity
    - go build -o cmd/csi-driver/nfs-csi-ngxstorage-driver ./cmd/csi-driver
  artifacts:
    paths:
      - build/shared-sanity/csi-sanity
      - cmd/csi-driver/nfs-csi-ngxstorage-driver
    expire_in: 1 week

sanity:
  stage: sanity
  # Live sanity touches the lab/array: it must never run automatically on a
  # source push. Explicit manual grant only; offline lint/test/build above
  # remain the normal automatic gate.
  when: manual
  allow_failure: true
  timeout: 90 minutes
  before_script:
    - command -v sudo >/dev/null 2>&1 || export SUDO=env
    - apt-get update -qq && apt-get install -y -qq nfs-common iputils-ping >/dev/null 2>&1
    - test -n "$STORAGE_DATA_IP" || (echo "STORAGE_DATA_IP is required" && exit 1)
    - timeout 5 bash -c "</dev/tcp/${STORAGE_DATA_IP}/2049" || (echo "Configured NFS data address is unreachable on port 2049" && exit 1)
  script:
    - bash tests/run-all-tests.sh sanity local --allow-live
  after_script:
    - ls -la tests/sanity/logs/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - tests/sanity/logs/
      - test-sanity-results_*.json
    expire_in: 2 weeks
