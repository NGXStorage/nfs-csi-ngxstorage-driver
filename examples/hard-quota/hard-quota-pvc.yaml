# spec.resources.requests.storage → soft_quota (1 GiB)
# spec.resources.limits.storage   → hard_quota (2 GiB)
# The share can grow up to 2 GiB but starts with a 1 GiB soft quota.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hard-quota-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
    limits:
      storage: 2Gi
  storageClassName: hard-quota-sc
