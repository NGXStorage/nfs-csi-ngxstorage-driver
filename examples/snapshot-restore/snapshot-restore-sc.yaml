apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: snapshot-restore-sc
provisioner: nfs.csi.ngxstorage.com
parameters:
  blocksize: "128k" # 4k, 8k, 16k, 32k, 64k, 128k, 256k, 512k, 1024k
  deduplication: "on" # "on", ""
  compression: "on" # "on", ""
volumeBindingMode: Immediate
reclaimPolicy: Delete
mountOptions:
  - nfsvers=4.1 # nfsvers=3, nfsvers=4.1
