apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nfs-csi-ngxstorage-node
  labels:
    app.kubernetes.io/name: nfs-csi-ngxstorage
    app.kubernetes.io/component: node
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nfs-csi-ngxstorage
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfs-csi-ngxstorage
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: nfs-csi-ngxstorage-node
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      # NGX defaults to NFSv3/nolock. Keep host PID/IPC for rpc-statd/nfsd
      # compatibility.
      hostPID: true
      hostNetwork: true
      hostIPC: true
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: node-driver-registrar
          image: quay.io/ngxstorage/csi-sidecars/csi-node-driver-registrar@sha256:f9de845b170155199f2a2a3f9531cf13d78e31235e9db6b6582a8b0db0a50dad
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/nfs.csi.ngxstorage.com/csi.sock
            - --v=2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: quay.io/ngxstorage/csi-sidecars/livenessprobe@sha256:06da0d5b8908072f2e4522692aee8dc119fba7247a9658497e1153992cd777e9
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            # Keep the NFS probe separate from the iSCSI node DaemonSet when
            # both drivers run on the same Kubernetes node.
            - --http-endpoint=0.0.0.0:9809
            - --probe-timeout=3s
            - --v=2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: nfs-csi-ngxstorage
          image: quay.io/ngxstorage/nfs-csi-ngxstorage@sha256:809528ed53c084730c1f645c6b8f4d8b04dfaac2a4ca3fbee81059606e39243b
          imagePullPolicy: Always
          args:
            - --endpoint=unix:///csi/csi.sock
            # Every process carries the Kubernetes node name it runs on; the
            # role flag tells a per-node worker from the cluster controller.
            - --role=node
            - --nodeid=$(KUBE_NODE_NAME)
            - --ip=$(STORAGE_IPS)
            - --pool-name=$(STORAGE_POOL_NAME)
            - --api-key=$(STORAGE_API_KEY)
            - --data-ip=$(STORAGE_DATA_IP)
            - --log=info
            # Optional distinct CSI identity for a second NGX Storage backend
            # on the same cluster. Set the same value on the controller and
            # every node manifest and in the StorageClass provisioner; empty
            # keeps the canonical nfs.csi.ngxstorage.com.
            # - --driver-prefix=205
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: STORAGE_IPS
              valueFrom:
                secretKeyRef:
                  name: nfs-csi-ngxstorage-config
                  key: storage-ips
            - name: STORAGE_POOL_NAME
              valueFrom:
                secretKeyRef:
                  name: nfs-csi-ngxstorage-config
                  key: pool-name
            - name: STORAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nfs-csi-ngxstorage-config
                  key: api-key
            - name: STORAGE_DATA_IP
              valueFrom:
                secretKeyRef:
                  name: nfs-csi-ngxstorage-config
                  key: data-ip
            - name: NGXSTORAGE_CSI_LOG_DIR
              value: "/host/var/log/ngxstorage/nfs"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9809
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            # Mounts are executed through the image's /host chroot wrappers.
            privileged: true
            readOnlyRootFilesystem: true
            capabilities:
              add: ["SYS_CHROOT", "SYS_ADMIN"]
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: host-root
              mountPath: /host
              mountPropagation: Bidirectional
            - name: host-dev
              mountPath: /dev
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/nfs.csi.ngxstorage.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
