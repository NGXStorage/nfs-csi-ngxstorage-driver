apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nfs-csi-ngxstorage-node-scc-use
  namespace: ngxstorage-nfs
rules:
- apiGroups: [security.openshift.io]
  resources: [securitycontextconstraints]
  resourceNames: [nfs-csi-ngxstorage-node-scc]
  verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nfs-csi-ngxstorage-node-scc-use
  namespace: ngxstorage-nfs
subjects:
- kind: ServiceAccount
  name: nfs-csi-ngxstorage-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nfs-csi-ngxstorage-node-scc-use
