apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ngxstorage.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nfs-csi-ngxstorage
    app.kubernetes.io/component: node
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nfs-csi-ngxstorage
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfs-csi-ngxstorage
        app.kubernetes.io/component: node
      {{- if .Values.openshift.enabled }}
      annotations:
        openshift.io/required-scc: {{ include "ngxstorage.fullname" . }}-node-scc
      {{- end }}
    spec:
      serviceAccountName: {{ include "ngxstorage.fullname" . }}-node
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      hostPID: true
      hostNetwork: true
      hostIPC: true
      nodeSelector:
        kubernetes.io/os: linux
        {{- if eq .Values.nodePlacement "worker" }}
        node-role.kubernetes.io/worker: ""
        {{- else if eq .Values.nodePlacement "master" }}
        node-role.kubernetes.io/master: ""
        {{- end }}
      tolerations:
        - operator: Exists
      containers:
        - name: node-driver-registrar
          image: quay.io/ngxstorage/csi-node-driver-registrar:v2.17.0
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/{{ include "ngxstorage.driverName" . }}/csi.sock
            - --v=2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: quay.io/ngxstorage/livenessprobe:v2.19.0
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=0.0.0.0:{{ .Values.nodeLivenessPort }}
            - --probe-timeout=3s
            - --v=2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: nfs-csi-ngxstorage
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --endpoint=unix:///csi/csi.sock
            - --role=node
            - --nodeid=$(KUBE_NODE_NAME)
            - --ip=$(STORAGE_IPS)
            - --pool-name=$(STORAGE_POOL_NAME)
            - --api-key=$(STORAGE_API_KEY)
            - --data-ip=$(STORAGE_DATA_IP)
            - --log={{ .Values.logLevel | quote }}
            {{- if .Values.driverNamePrefix }}
            - --driver-prefix={{ .Values.driverNamePrefix }}
            {{- end }}
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: STORAGE_IPS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: storage-ips
            - name: STORAGE_POOL_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: pool-name
            - name: STORAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: api-key
            - name: STORAGE_DATA_IP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: data-ip
            - name: NFS_CSI_LOG_DIR
              value: "/var/log/nfs-csi-ngxstorage"
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.nodeLivenessPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_CHROOT", "SYS_ADMIN"]
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: host-root
              mountPath: /host
              mountPropagation: Bidirectional
            - name: host-dev
              mountPath: /dev
            - name: log-dir
              mountPath: /var/log/nfs-csi-ngxstorage
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/{{ include "ngxstorage.driverName" . }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: log-dir
          hostPath:
            path: /var/log/nfs-csi-ngxstorage
            type: DirectoryOrCreate
