apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ngxstorage.fullname" . }}-controller
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nfs-csi-ngxstorage
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nfs-csi-ngxstorage
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfs-csi-ngxstorage
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "ngxstorage.fullname" . }}-controller
      priorityClassName: system-cluster-critical
      nodeSelector:
        kubernetes.io/os: linux
        {{- if eq .Values.controllerPlacement "master" }}
        node-role.kubernetes.io/master: ""
        {{- else if eq .Values.controllerPlacement "worker" }}
        node-role.kubernetes.io/worker: ""
        {{- end }}
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists
      securityContext: {}
      containers:
        - name: external-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --timeout=300s
            - --feature-gates=VolumeAttributesClass=false
            - --v=2
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: external-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.12.0
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --timeout=300s
            - --v=2
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: external-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --timeout=300s
            - --feature-gates=VolumeAttributesClass=false
            - --v=2
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: external-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --timeout=300s
            - --v=2
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=0.0.0.0:{{ .Values.controllerLivenessPort }}
            - --probe-timeout=3s
            - --v=2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: nfs-csi-ngxstorage
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --endpoint=unix:///csi/csi.sock
            - --role=controller
            - --ip=$(STORAGE_IPS)
            - --pool-name=$(STORAGE_POOL_NAME)
            - --api-key=$(STORAGE_API_KEY)
            - --data-ip=$(STORAGE_DATA_IP)
            - --log={{ .Values.logLevel | quote }}
            {{- if .Values.driverNamePrefix }}
            - --driver-prefix={{ .Values.driverNamePrefix }}
            {{- end }}
          env:
            - name: STORAGE_IPS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: storage-ips
            - name: STORAGE_POOL_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: pool-name
            - name: STORAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: api-key
            - name: STORAGE_DATA_IP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: data-ip
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.controllerLivenessPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
