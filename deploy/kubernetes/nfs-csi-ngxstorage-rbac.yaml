apiVersion: v1
kind: Namespace
metadata:
  name: nfs-csi-ngxstorage
  labels:
    app.kubernetes.io/name: nfs-csi-ngxstorage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfs-csi-ngxstorage-controller
  namespace: nfs-csi-ngxstorage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfs-csi-ngxstorage-node
  namespace: nfs-csi-ngxstorage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nfs-csi-ngxstorage-controller
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses", "volumesnapshots"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nfs-csi-ngxstorage-controller
subjects:
  - kind: ServiceAccount
    name: nfs-csi-ngxstorage-controller
    namespace: nfs-csi-ngxstorage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nfs-csi-ngxstorage-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nfs-csi-ngxstorage-leader-election
  namespace: nfs-csi-ngxstorage
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nfs-csi-ngxstorage-leader-election
  namespace: nfs-csi-ngxstorage
subjects:
  - kind: ServiceAccount
    name: nfs-csi-ngxstorage-controller
    namespace: nfs-csi-ngxstorage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nfs-csi-ngxstorage-leader-election
